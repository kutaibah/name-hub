<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="cn-wm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Logo icon (scaled to 48x48) -->
  <g transform="scale(0.75)">
    <!-- Rounded square background -->
    <rect width="64" height="64" rx="14" fill="url(#cn-wm-gradient)"/>
    
    <!-- Trail: small dots -->
    <circle cx="9" cy="32" r="1.8" fill="white"/>
    <circle cx="15" cy="32" r="2.2" fill="white"/>
    
    <!-- Trail: dashes -->
    <rect x="20" y="30" width="5" height="4" rx="1.5" fill="white"/>
    <rect x="27" y="30" width="6" height="4" rx="1.5" fill="white"/>
    
    <!-- Arrowhead -->
    <path d="M35 28 L41 32 L35 36 Z" fill="white"/>
    
    <!-- Name tag -->
    <g transform="translate(51, 32) rotate(45)">
      <path d="M-6 -7 L6 -7 L6 7 L-6 7 L-10 0 Z" fill="white"/>
      <circle cx="2" cy="0" r="2" fill="url(#cn-wm-gradient)"/>
    </g>
  </g>
  
  <!-- "Canton Names" text -->
  <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#111827">Canton Names</text>
</svg>
