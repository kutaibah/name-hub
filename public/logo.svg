<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cn-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#cn-gradient)"/>
  
  <!-- Trail: dots (uniform height 4px, evenly spaced) -->
  <circle cx="10" cy="32" r="2" fill="white"/>
  <circle cx="17" cy="32" r="2" fill="white"/>
  
  <!-- Trail: dashes (same 4px height, evenly spaced) -->
  <rect x="22" y="30" width="5" height="4" rx="1" fill="white"/>
  <rect x="29" y="30" width="5" height="4" rx="1" fill="white"/>
  
  <!-- Arrowhead pointing right -->
  <path d="M36 28 L42 32 L36 36 Z" fill="white"/>
  
  <!-- Name tag: symmetric luggage tag shape, horizontal, point facing left -->
  <!-- Body: rounded rect 16x10 with pointed left end -->
  <path d="M45 27 L57 27 Q59 27 59 29 L59 35 Q59 37 57 37 L45 37 L41 32 Z" fill="white"/>
  <!-- Centered hole -->
  <circle cx="53" cy="32" r="2.5" fill="url(#cn-gradient)"/>
</svg>
