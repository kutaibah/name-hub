<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="cn-wml-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Logo icon (scaled to 48x48) -->
  <g transform="scale(0.75)">
    <!-- Rounded square background -->
    <rect width="64" height="64" rx="14" fill="url(#cn-wml-gradient)"/>
    
    <!-- Trail: dots -->
    <circle cx="10" cy="32" r="2" fill="white"/>
    <circle cx="17" cy="32" r="2" fill="white"/>
    
    <!-- Trail: dashes -->
    <rect x="22" y="30" width="5" height="4" rx="1" fill="white"/>
    <rect x="29" y="30" width="5" height="4" rx="1" fill="white"/>
    
    <!-- Arrowhead -->
    <path d="M36 28 L42 32 L36 36 Z" fill="white"/>
    
    <!-- Name tag -->
    <path d="M45 27 L57 27 Q59 27 59 29 L59 35 Q59 37 57 37 L45 37 L41 32 Z" fill="white"/>
    <circle cx="53" cy="32" r="2.5" fill="url(#cn-wml-gradient)"/>
  </g>
  
  <!-- "Canton Names" text (white for dark backgrounds) -->
  <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Canton Names</text>
</svg>
